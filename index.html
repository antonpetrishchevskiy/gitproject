<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Homework #8</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/adaptive.css">
</head>
<body>

<div class="main">
    <div class="left-side-container">
        <div class="left-side">
            <h2>Get your free account</h2>
            <div class="subtitle">Try homeWorks BUSINESS free for 15 days.<br>
                Downgrade to Basic (Free Forever) anytime.
            </div>
            <form id="form">
                <label class="input-container" for="full_name">Full name
                    <input type="text" id="full_name" name="full_name">
                </label>

                    <label class="input-container" for="username">Your username
                        <input type="text" id="username" name="username">
                    </label>

                    <label class="input-container" for="e_mail">E-mail
                        <input type="email" id="e_mail" name="e_mail">
                    </label>

                    <label  class="input-container" for="password">Password
                        <input type="password" id="password" name="password">
                    </label>

                    <label class="input-container" for="repeat_password">repeat Password
                        <input type="password" id="repeat_password" name="repeat_password">
                    </label>

                <div class="checkbox-label">
                    <input type="checkbox" id="checkbox_option" class="checkbox-input">
                    <label for="checkbox_option">Agree to our Terms of Service and Privacy Statement</label>
                </div>
                <div class="button-container">
                    <button type="submit" class="btn" id="btn">Sign Up</button>
                </div>
                <div class="link">
                    <a href="#" id="link">Already have an account?</a>
                </div>
            </form>
            <div id="popup" class="popup">
                <p>На вашу почту выслана ссылка, перейдите по ней, чтобы завершить регистрацию</p>
                <button class="popup_button" id="popupBtn">ОК</button>
            </div>

        </div>
    </div>
    <div class="right-side">
        <div class="image">
            <img src="images/image.png" alt="rocket">
        </div>
    </div>
    <div class="logo">
        <img src="images/homeWorks.png" alt="logo">
    </div>
</div>
<!--<div class="rocket_move">
    <img src="images/rocket_new_2-Photoroom.png" alt="rocket_moving">
</div>-->


<script src="script.js"></script>
</body>
</html>
